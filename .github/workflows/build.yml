name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/GraveOps.App/GraveOps.App.csproj

      - name: Build
        run: dotnet build src/GraveOps.App/GraveOps.App.csproj -c Release --no-restore